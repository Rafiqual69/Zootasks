name: Promotion PostgreSQL Regression

on:
  push:
    branches:
      - "security/**"
  pull_request:
    branches:
      - "main"
      - "security/full-integrated-security-board-20261007"

permissions:
  contents: read

jobs:
  promotion-postgres-regression:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zootasks_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d zootasks_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'ephemeral-ci-only-key-not-for-production' }}
      ALLOWED_HOSTS: localhost,127.0.0.1
      PRODUCTION_MODE: "false"
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/zootasks_ci
      SECURE_SSL_REDIRECT: "false"
      SECURE_COOKIES: "false"
      TRUST_PROXY_SSL: "false"
      SECURE_HSTS_SECONDS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Run promotion transition and PostgreSQL last-slot concurrency regressions
        working-directory: backend
        run: |
          python manage.py test promotions.test_transition_regressions promotions.test_last_slot_concurrency --verbosity 2
