name: ZooTasks PostgreSQL Financial Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zootasks-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-financial:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zootasks_ci
          POSTGRES_USER: zootasks_ci
          POSTGRES_PASSWORD: zootasks_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zootasks_ci -d zootasks_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DJANGO_SETTINGS_MODULE: config.settings_postgres_ci
      SECRET_KEY: ci-only-postgres-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      OWNER_USERNAME: ci-owner
      POSTGRES_DB: zootasks_ci
      POSTGRES_USER: zootasks_ci
      POSTGRES_PASSWORD: zootasks_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Migration drift check
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Full regression on PostgreSQL
        working-directory: backend
        run: python manage.py test --verbosity=2

      - name: Use PostgreSQL 16 client tools
        run: |
          mkdir -p "$RUNNER_TEMP/postgres16-client"
          cat > "$RUNNER_TEMP/postgres16-client/pg_dump" <<'EOF'
          #!/usr/bin/env bash
          exec docker run --rm --network host -v "$RUNNER_TEMP:$RUNNER_TEMP" -e PGPASSWORD="${PGPASSWORD:-}" postgres:16 pg_dump "$@"
          EOF
          cat > "$RUNNER_TEMP/postgres16-client/pg_restore" <<'EOF'
          #!/usr/bin/env bash
          exec docker run --rm --network host -v "$RUNNER_TEMP:$RUNNER_TEMP" -e PGPASSWORD="${PGPASSWORD:-}" postgres:16 pg_restore "$@"
          EOF
          chmod 700 "$RUNNER_TEMP/postgres16-client/pg_dump" "$RUNNER_TEMP/postgres16-client/pg_restore"
          echo "$RUNNER_TEMP/postgres16-client" >> "$GITHUB_PATH"

      - name: Synthetic PostgreSQL dump and isolated restore drill
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: zootasks_ci
          PGPASSWORD: zootasks_ci_password
          PGDATABASE: zootasks_ci
          PGADMIN_URL: postgresql://zootasks_ci:zootasks_ci_password@127.0.0.1:5432/postgres
        run: |
          pg_dump --version
          pg_restore --version
          pg_dump --format=custom --file="$RUNNER_TEMP/zootasks-ci.dump" "$PGDATABASE"
          test -s "$RUNNER_TEMP/zootasks-ci.dump"
          bash scripts/restore_drill_postgres.sh "$RUNNER_TEMP/zootasks-ci.dump" restore_drill_ci
