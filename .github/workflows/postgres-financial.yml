name: ZooTasks PostgreSQL Financial Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zootasks-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-financial:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zootasks_ci
          POSTGRES_USER: zootasks_ci
          POSTGRES_PASSWORD: zootasks_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zootasks_ci -d zootasks_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DJANGO_SETTINGS_MODULE: config.settings_postgres_ci
      ALLOWED_HOSTS: localhost,127.0.0.1
      OWNER_USERNAME: ci-owner
      POSTGRES_DB: zootasks_ci
      POSTGRES_USER: zootasks_ci
      POSTGRES_PASSWORD: zootasks_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Generate ephemeral CI secret key
        run: python -c "import secrets; print('SECRET_KEY=' + secrets.token_urlsafe(64))" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Migration drift check
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Apply PostgreSQL migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Financial migration preflight invariant checks
        env:
          DATABASE_URL: "postgresql://zootasks_ci:zootasks_ci_password@127.0.0.1:5432/zootasks_ci"
        run: |
          bash -n scripts/preflight_financial_migrations.sh
          bash scripts/preflight_financial_migrations.sh

      - name: Isolated PostgreSQL backup/restore drill (synthetic CI database only)
        env:
          PGADMIN_URL: "postgresql://zootasks_ci:zootasks_ci_password@127.0.0.1:5432/zootasks_ci"
        run: |
          docker pull postgres:16
          bash -n scripts/restore_drill_postgres.sh
          TMP_DIR="$(mktemp -d)"
          cleanup_restore_test() { rm -rf "$TMP_DIR"; }
          trap cleanup_restore_test EXIT
          DUMP_FILE="$TMP_DIR/zootasks-ci.dump"
          docker run --network host --rm -v "$TMP_DIR:/tmp/restore-drill" postgres:16 pg_dump --format=custom --no-owner --file=/tmp/restore-drill/zootasks-ci.dump "$PGADMIN_URL"
          test -s "$DUMP_FILE"
          docker run --network host --rm -v "$GITHUB_WORKSPACE/scripts/restore_drill_postgres.sh:/restore_drill_postgres.sh:ro" -v "$TMP_DIR:/tmp/restore-drill" -e PGADMIN_URL="$PGADMIN_URL" postgres:16 bash /restore_drill_postgres.sh /tmp/restore-drill/zootasks-ci.dump "restore_drill_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
      - name: Full regression on PostgreSQL
        working-directory: backend
        run: python manage.py test --verbosity=2
