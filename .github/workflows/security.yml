name: ZooTasks Security Gate

on:
  push:
    branches:
      - main
      - ci/**
      - feat/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: zootasks-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Generate ephemeral CI secret key
        shell: bash
        run: |
          set -euo pipefail
          SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          echo "::add-mask::$SECRET_KEY"
          printf 'SECRET_KEY=%s\n' "$SECRET_KEY" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Django system check
        working-directory: backend
        env:
          ALLOWED_HOSTS: localhost,127.0.0.1
          OWNER_USERNAME: "ci-owner"
        run: python manage.py check

      - name: Django deployment security check
        working-directory: backend
        env:
          ALLOWED_HOSTS: localhost,127.0.0.1
          OWNER_USERNAME: "ci-owner"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/zootasks_ci"
          PRODUCTION_MODE: "true"
          SECURE_SSL_REDIRECT: "true"
          SECURE_COOKIES: "true"
          TRUST_PROXY_SSL: "true"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          SECURE_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy

      - name: Migration drift check
        working-directory: backend
        env:
          ALLOWED_HOSTS: localhost,127.0.0.1
          OWNER_USERNAME: "ci-owner"
        run: python manage.py makemigrations --check --dry-run

      - name: Read/write security policy contract
        working-directory: backend
        run: python -m unittest core.test_security_policy -v

      - name: Full regression tests
        working-directory: backend
        env:
          ALLOWED_HOSTS: localhost,127.0.0.1
          OWNER_USERNAME: "ci-owner"
        run: |
          python manage.py migrate --noinput
          python manage.py test

      - name: Dependency vulnerability audit
        working-directory: backend
        run: pip-audit -r requirements.txt

      - name: Backup script syntax and isolation smoke test
        run: |
          bash -n backup-zootasks.sh
          TMP_HOME="$(mktemp -d)"
          SMOKE_DIR="$GITHUB_WORKSPACE/.security-backup-smoke"
          cleanup_smoke() {
            rm -rf "$TMP_HOME" "$SMOKE_DIR"
          }
          trap cleanup_smoke EXIT
          mkdir -p "$TMP_HOME" "$SMOKE_DIR/nested/backups" "$SMOKE_DIR/nested/keys" "$SMOKE_DIR/nested/dumps" "$SMOKE_DIR/nested/media" "$SMOKE_DIR/nested/.ssh" "$SMOKE_DIR/nested/secrets" "$SMOKE_DIR/nested/credentials" "$SMOKE_DIR/nested/uploads"
          printf 'synthetic-secret' > "$SMOKE_DIR/nested/.env"
          printf 'synthetic-env-secret' > "$SMOKE_DIR/nested/.env.production"
          printf 'synthetic-recovery-data' > "$SMOKE_DIR/nested/backups/should-not-archive.txt"
          printf 'synthetic-private-key' > "$SMOKE_DIR/nested/keys/test.key"
          printf 'synthetic-certificate' > "$SMOKE_DIR/nested/cert.pem"
          printf 'synthetic-database-dump' > "$SMOKE_DIR/nested/dumps/production-dump.sql.gz"
          printf 'synthetic-upload' > "$SMOKE_DIR/nested/media/private-upload.jpg"
          printf 'synthetic-ssh-key' > "$SMOKE_DIR/nested/.ssh/id_ed25519"
          printf 'synthetic-secret-file' > "$SMOKE_DIR/nested/secrets/credentials.json"
          printf 'synthetic-token-file' > "$SMOKE_DIR/nested/credentials/service-token.txt"
          printf 'synthetic-upload' > "$SMOKE_DIR/nested/uploads/private-upload.jpg"
          ln -s "$GITHUB_WORKSPACE" "$TMP_HOME/ZooTasks"
          HOME="$TMP_HOME" bash "$GITHUB_WORKSPACE/backup-zootasks.sh"
          BACKUP_FILE="$(find "$TMP_HOME/zootasks-backups" -maxdepth 1 -name 'zootasks-backup-*.tar.gz' -print -quit)"
          test -n "$BACKUP_FILE"
          test "$(stat -c '%a' "$BACKUP_FILE")" = "600"
          ! tar -tzf "$BACKUP_FILE" | grep -E '(^|/)(\.env([^/]*$)?|\.git/|db\.sqlite3$|backups/|\.ssh/|keys/|dumps/|media/|uploads/|secrets/|credentials/)|\.(pem|key|p12|pfx|jks|keystore|dump|pgdump|rdb|aof)$|\.sql\.gz$|(-dump|-backup|production|prod)\.sql

      - name: Check whitespace errors
        run: git diff --check


      - name: Check whitespace errors
        run: git diff --check
