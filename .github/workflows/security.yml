name: ZooTasks Security Gate

on:
  push:
    branches:
      - main
      - ci/**
      - feat/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: zootasks-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Django system check
        working-directory: backend
        env:
          SECRET_KEY: ci-only-secret-key-zootasks-security-gate-2026
          ALLOWED_HOSTS: localhost,127.0.0.1
          OWNER_USERNAME: "ci-owner"
        run: python manage.py check

      - name: Django deployment security check
        working-directory: backend
        env:
          SECRET_KEY: ci-only-secret-key-zootasks-security-gate-2026
          ALLOWED_HOSTS: localhost,127.0.0.1
          OWNER_USERNAME: "ci-owner"
          PRODUCTION_MODE: "true"
          SECURE_SSL_REDIRECT: "true"
          SECURE_COOKIES: "true"
          TRUST_PROXY_SSL: "true"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          SECURE_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy

      - name: Migration drift check
        working-directory: backend
        env:
          SECRET_KEY: ci-only-secret-key-zootasks-security-gate-2026
          ALLOWED_HOSTS: localhost,127.0.0.1
          OWNER_USERNAME: "ci-owner"
        run: python manage.py makemigrations --check --dry-run

      - name: Full regression tests
        working-directory: backend
        env:
          SECRET_KEY: ci-only-secret-key-zootasks-security-gate-2026
          ALLOWED_HOSTS: localhost,127.0.0.1
          OWNER_USERNAME: "ci-owner"
        run: |
          python manage.py migrate --noinput
          python manage.py test

      - name: Dependency vulnerability audit
        working-directory: backend
        run: pip-audit -r requirements.txt

      - name: Check whitespace errors
        run: git diff --check
