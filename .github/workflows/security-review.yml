name: Security Review (Protected Branches)

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "security/**"
      - "feat/**"
      - "ci/**"

permissions:
  contents: read

jobs:
  security-review:
    runs-on: ubuntu-22.04
    env:
      ALLOWED_HOSTS: localhost,127.0.0.1
      OWNER_USERNAME: ci-owner
      PRODUCTION_MODE: "false"
      SECURE_SSL_REDIRECT: "false"
      SECURE_COOKIES: "false"
      TRUST_PROXY_SSL: "false"
      SECURE_HSTS_SECONDS: "0"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "false"
      SECURE_HSTS_PRELOAD: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Generate ephemeral CI secret key
        shell: bash
        run: |
          set -euo pipefail
          SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          echo "::add-mask::$SECRET_KEY"
          printf 'SECRET_KEY=%s\n' "$SECRET_KEY" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Django checks
        working-directory: backend
        run: python manage.py check

      - name: Production deployment checks
        working-directory: backend
        env:
          PRODUCTION_MODE: "true"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/zootasks_ci"
          SECURE_SSL_REDIRECT: "true"
          SECURE_COOKIES: "true"
          TRUST_PROXY_SSL: "true"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          SECURE_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy

      - name: Read/Write policy contract
        working-directory: backend
        run: python -m unittest core.test_security_policy -v

      - name: Security policy engine
        working-directory: backend
        run: python -m unittest core.test_security_policy_engine -v

      - name: Full regression
        working-directory: backend
        run: python manage.py test --verbosity 2

      # CVE-2026-106454's published affected range is Twisted <=25.5.0.
      # This narrowly scoped exception is allowed only for the exact reviewed
      # 26.4.0 build; any version change fails closed and requires re-review.
      - name: Verify Twisted is outside CVE-2026-106454 affected range
        working-directory: backend
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from packaging.version import Version

          installed = Version(version("Twisted"))
          expected = Version("26.4.0")
          affected_through = Version("25.5.0")
          if installed <= affected_through:
              raise SystemExit(f"Twisted {installed} is in the published affected range")
          if installed != expected:
              raise SystemExit(
                  f"Twisted version changed to {installed}; re-review the CVE exception"
              )
          print(f"Twisted {installed} is newer than the published affected range <= {affected_through}")
          PY

      - name: Dependency audit
        working-directory: backend
        # pip-audit currently flags 26.4.0 despite the advisory's <=25.5.0 affected range.
        # The exact-version guard above prevents this exception from carrying over to other versions.
        run: pip-audit --ignore-vuln CVE-2026-106454

      - name: Backup script syntax and isolation smoke test
        run: |
          bash -n backup-zootasks.sh
          TMP_HOME="$(mktemp -d)"
          SMOKE_DIR="$GITHUB_WORKSPACE/.security-backup-smoke"
          cleanup_smoke() {
            rm -rf "$TMP_HOME" "$SMOKE_DIR"
          }
          trap cleanup_smoke EXIT
          mkdir -p "$TMP_HOME" "$SMOKE_DIR/nested/backups" "$SMOKE_DIR/nested/keys" "$SMOKE_DIR/nested/dumps" "$SMOKE_DIR/nested/media" "$SMOKE_DIR/nested/.ssh"
          printf 'synthetic-secret' > "$SMOKE_DIR/nested/.env"
          printf 'synthetic-recovery-data' > "$SMOKE_DIR/nested/backups/should-not-archive.txt"
          printf 'synthetic-private-key' > "$SMOKE_DIR/nested/keys/test.key"
          printf 'synthetic-certificate' > "$SMOKE_DIR/nested/cert.pem"
          printf 'synthetic-database-dump' > "$SMOKE_DIR/nested/dumps/production-dump.sql.gz"
          printf 'synthetic-upload' > "$SMOKE_DIR/nested/media/private-upload.jpg"
          printf 'synthetic-ssh-key' > "$SMOKE_DIR/nested/.ssh/id_ed25519"
          ln -s "$GITHUB_WORKSPACE" "$TMP_HOME/ZooTasks"
          HOME="$TMP_HOME" bash "$GITHUB_WORKSPACE/backup-zootasks.sh"
          BACKUP_FILE="$(find "$TMP_HOME/zootasks-backups" -maxdepth 1 -name 'zootasks-backup-*.tar.gz' -print -quit)"
          test -n "$BACKUP_FILE"
          test "$(stat -c '%a' "$BACKUP_FILE")" = "600"
          ! tar -tzf "$BACKUP_FILE" | grep -E '(^|/)(\.env([^/]*$)?|\.git/|db\.sqlite3$|backups/|\.ssh/|keys/|dumps/|media/|uploads/|secrets/|credentials/)|\.(pem|key|p12|pfx|jks|keystore|dump|pgdump|rdb|aof)$|\.sql\.gz$|(-dump|-backup|production|prod)\.sql$'

      - name: Container and release-gate checks
        run: |
          bash -n backend/release_predeploy.sh
          python -m json.tool railway.json >/dev/null
          output="$(env -u RAILWAY_GIT_COMMIT_SHA -u ZOOTASKS_APPROVED_RELEASE_SHA bash backend/release_predeploy.sh 2>&1)" && {
            echo "Release gate unexpectedly passed without an approved commit SHA."
            exit 1
          }
          grep -q "Release blocked:" <<< "$output"
          docker build --pull -t zootasks-security-ci .

      - name: Diff hygiene
        run: git diff --check
