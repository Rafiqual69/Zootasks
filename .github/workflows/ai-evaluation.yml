name: AI Evaluation Evidence

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  ai-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run AI evaluation
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-only-secret-key-zootasks-ai-evaluation-2026-long-random-placeholder
          ZOOTASKS_GIT_COMMIT: ${{ github.sha }}
          AI_PRODUCTION_APPROVED: "false"
          AI_APPROVAL_REFERENCE: ""
        run: |
          python -m core.ai_evaluation_runner artifacts/ai/AI-SYS-001-evidence.json
          python manage.py test core.ai_gateway_tests core.ai_evaluation_runner_tests core.ai_agent_capability_gate_tests core.ai_provider_offer_tests core.ai_provider_registry_tests core.ai_provider_change_detection_tests core.ai_provider_adapter_tests core.ai_provider_ingress_tests core.ai_worker_eligibility_tests core.ai_innovation_loop_tests core.ai_innovation_genome_tests core.ai_acquisition_gate_tests core.ai_provider_circuit_breaker_tests core.ai_innovation_genome_tests core.ai_action_taxonomy_tests core.ai_adversarial_regression_tests core.ai_runtime_monitor_tests core.ai_incident_response_tests core.ai_privacy_gate_tests core.ai_release_tevv_gate_tests
      - name: Validate evidence JSON
        working-directory: backend
        run: python -m json.tool artifacts/ai/AI-SYS-001-evidence.json >/dev/null
      - name: Validate provider offer schema JSON
        run: python -m json.tool docs/ai/AI_PROVIDER_OFFER_SCHEMA.json >/dev/null
      - name: Verify evidence integrity
        working-directory: backend
        env:
          EXPECTED_GIT_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from core.ai_evaluation_integrity import evidence_sha256
          path = "artifacts/ai/AI-SYS-001-evidence.json"
          with open(path, encoding="utf-8") as handle:
              evidence = json.load(handle)
          if evidence["integrity"]["evidence_sha256"] != evidence_sha256(evidence):
              raise SystemExit("AI evidence integrity verification failed")
          if evidence["provenance"]["git_commit"] != os.environ["EXPECTED_GIT_COMMIT"]:
              raise SystemExit("AI evidence Git provenance mismatch")
          print(evidence["integrity"]["evidence_sha256"])
          PY
      - name: Generate cryptographic artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: backend/artifacts/ai/AI-SYS-001-evidence.json

      - name: Upload evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: AI-SYS-001-evidence-${{ github.sha }}
          path: backend/artifacts/ai/AI-SYS-001-evidence.json
          if-no-files-found: error
