{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Task - ZooTasks</title>
    <link rel="stylesheet" href="{% static 'css/zootasks.css' %}">
</head>
<body class="zt-submit-page">

<header class="zt-market-header">
    <div class="zt-market-container zt-market-nav">
        <a class="zt-market-brand" href="/">🦁 ZooTasks</a>
        <nav class="zt-market-links" aria-label="Primary navigation">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'task_marketplace' %}">Tasks</a>
            <a href="/">Home</a>
        </nav>
    </div>
</header>

<main class="zt-market-container zt-submit-content">
    <section class="zt-submit-card">
        <span class="zt-market-eyebrow">TASK SUBMISSION</span>

        <h1>📤 Submit Task</h1>

        <h2>{{ claim.task.title }}</h2>

        <p class="zt-submit-description">
            {{ claim.task.description }}
        </p>

        <form method="post" class="zt-submit-form">
            {% csrf_token %}

            <label for="proof">Completion proof</label>
            <textarea
                id="proof"
                name="proof"
                placeholder="Describe how you completed the task..."
                required
            ></textarea>

            <button class="zt-task-button" type="submit">
                ✓ Submit Proof
            </button>
        </form>

        <a class="zt-submit-back" href="{% url 'task_marketplace' %}">
            ← Back to Tasks
        </a>
    </section>
</main>

</body>
</html>
