<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Task - ZooTasks</title>
</head>

<body>

<h1>Submit Completed Task</h1>

<p>
Task:
<strong>{{ claim.task.title }}</strong>
</p>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Submit for Review
    </button>
</form>

<p>
<a href="{% url 'task_detail' claim.task.id %}">
    ← Back
</a>
</p>

</body>
</html>
